[project]
name = "marketplace-finder"
version = "0.1.0"
description = "Hourly marketplace search for whatever you collect, described by Claude and posted to a Discord channel"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.48",
]

[project.scripts]
marketplace-finder = "marketplace_finder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
